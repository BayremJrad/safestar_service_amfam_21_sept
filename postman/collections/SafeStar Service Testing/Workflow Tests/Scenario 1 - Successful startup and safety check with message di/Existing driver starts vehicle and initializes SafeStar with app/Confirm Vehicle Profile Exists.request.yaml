$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |
      const vinDecode = pm.require('npm:vin-decode@0.2.0');
      const qa_workshop_package = pm.require('@postvehicle-enterprise-team-31d252a8-1f35-4567-b4cd-ab4db1f4/qa_workshop_package');

      pm.test("VIN is a validly-formatted string", function () {
          var jsonData = pm.response.json();
          console.log("Checking VIN: " + jsonData.vehicle.vin + " ...");
          pm.expect(jsonData.vehicle.vin).to.be.a.string;
          pm.expect(qa_workshop_package.isValidVIN(jsonData.vehicle.vin)).to.be.true;
          console.log("Decoding a VIN ...");
          console.log(vinDecode(jsonData.vehicle.vin).decode());
      });
    language: text/javascript
    packages:
      npm:vin-decode@0.2.0:
        id: npm:vin-decode@0.2.0
      "@postvehicle-enterprise-team-31d252a8-1f35-4567-b4cd-ab4db1f4/qa_workshop_package":
        id: 01a0ca86-9642-750e-ac8c-810455c7073d
order: 2000
